name: Desktop Linux lane
on:
  pull_request:
  push:
    branches:
      - chore/web-bun-migration
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build, check, and compile the Linux desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a moving Bun version makes the lane's environment drift
          # even though the lockfile freezes the dependencies.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils

      # The recorded-session replay drives tools that run confined, so the
      # runner needs a working sandbox backend. The upstream script pins a
      # bubblewrap build and lifts the unprivileged user-namespace restriction
      # the hosted image applies.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build the workspace
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The shell's copy is generated from the Electron shell's locale, so the
      # generated Rust module must match the source it derives from.
      - name: Check the generated shell copy
        run: bun apps/desktop-tauri/scripts/generate-locale.ts --check

      # The repository-wide suite belongs to the upstream CI, which shards it
      # across runners; this lane covers the packages the desktop fork touches
      # and the desktop shell itself.
      - name: Build the native system addon
        run: bun run build:native-system

      - name: Unit tests of the touched packages
        run: >
          bunx vitest run
          packages/subprocess/subprocess-local
          packages/session/session-persistence-jsonl
          packages/attachment/attachment-local
          --pool=forks

      - name: Keyless recorded-session replay
        env:
          # The replay spawns child processes; the hosted runner has two cores,
          # and the subagent replays need one to themselves.
          DSH_SNAPSHOT_MAX_CONCURRENCY: '2'
        run: bun run test:snapshot

      - name: Build the desktop shell
        run: cargo build --release --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml

      - name: Test the native provider crate
        run: cargo test --manifest-path native/dsh-native/Cargo.toml --lib

      - name: Desktop Host tests
        run: bunx vitest run apps/desktop-host --pool=forks
