name: Desktop Linux lane
on:
  pull_request:
  push:
    branches:
      - chore/web-bun-migration
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Build, check, and compile the Linux desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift gate compares against the branch base, so the full
          # history is required.
          fetch-depth: 0
          # The job runs contributor code; the token must not stay in
          # .git/config while it does.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a moving Bun version makes the lane's environment drift
          # even though the lockfile freezes the dependencies.
          bun-version: 1.4.3

      - name: Refuse edits to the Electron carrier
        env:
          DSH_DESKTOP_DRIFT_BASE: origin/${{ github.base_ref || 'master' }}
        run: bun apps/desktop-tauri/scripts/desktop-drift-gate.ts "$DSH_DESKTOP_DRIFT_BASE"

      # The workspace is installed with pnpm, the lane that owns the release
      # packaging. pnpm's hoisted layout exposes every workspace package to
      # Node's resolver; Bun's isolated layout keeps them apart, and a nested
      # runtime that resolves a workspace package by name then cannot find
      # it. The upstream CI installs the same way.
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils

      # The recorded-session replay drives tools that run confined, so the
      # runner needs a working sandbox backend. The upstream script pins a
      # bubblewrap build and lifts the unprivileged user-namespace restriction
      # the hosted image applies.
      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build the workspace
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The shell's copy is generated from the Electron shell's locale, so the
      # generated Rust module must match the source it derives from.
      - name: Check the generated shell copy
        run: bun apps/desktop-tauri/scripts/generate-locale.ts --check

      # The repository-wide suite belongs to the upstream CI, which shards it
      # across runners; this lane covers the packages the desktop fork touches
      # and the desktop shell itself.
      - name: Build the native system addon
        run: bun run build:native-system

      - name: Unit tests of the touched packages
        run: >
          bunx vitest run
          packages/subprocess/subprocess-local
          packages/session/session-persistence-jsonl
          packages/attachment/attachment-local
          --pool=forks

      # The native module replaces the sharp package in the payload, so the
      # two must behave the same way on the operations the attachment service
      # uses. The comparison runs against the shim in the repository, with the
      # sharp package the repository still installs as the reference.
      - name: Build the native providers
        run: bash apps/desktop-tauri/scripts/build-native.sh linux-x64

      - name: Compare the native image provider with sharp
        env:
          DSH_IMAGE_SHIM: ${{ github.workspace }}/apps/desktop-host/native/sharp.cjs
          DSH_IMAGE_SHARP: ${{ github.workspace }}/packages/attachment/attachment-local/node_modules/sharp
        run: node apps/desktop-tauri/scripts/image-parity.mjs

      - name: Keyless recorded-session replay
        env:
          # The replay spawns a child runtime per scenario, and the hosted
          # runner has two cores. Running the scenarios one at a time gives
          # each child the whole runner; the parallel setting leaves the
          # child runtimes without a core, and the two subagent replays that
          # need a nested child then fail.
          DSH_SNAPSHOT_MAX_CONCURRENCY: '1'
          DSH_SNAPSHOT_MAX_WORKERS: '1'
        run: bun run test:snapshot

      - name: Build the desktop shell
        run: cargo build --release --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml

      - name: Test the native provider crate
        run: cargo test --manifest-path native/dsh-native/Cargo.toml --lib

      - name: Desktop Host tests
        run: bunx vitest run apps/desktop-host --pool=forks
