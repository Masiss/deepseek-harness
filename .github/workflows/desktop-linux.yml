name: Desktop Linux lane
on:
  pull_request:
  push:
    branches:
      - chore/web-bun-migration
  workflow_dispatch:

concurrency:
  group: desktop-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Build, check, and compile the Linux desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils

      - name: Build the workspace
        run: bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # The repository-wide suite belongs to the upstream CI, which shards it
      # across runners; this lane covers the packages the desktop fork touches
      # and the desktop shell itself.
      - name: Build the native system addon
        run: bun run build:native-system

      - name: Unit tests of the touched packages
        run: >
          bunx vitest run
          packages/subprocess/subprocess-local
          packages/session/session-persistence-jsonl
          packages/attachment/attachment-local
          --pool=forks

      - name: Keyless recorded-session replay
        run: bun run test:snapshot

      - name: Build the desktop shell
        run: cargo build --release --manifest-path apps/desktop-tauri/src-tauri/Cargo.toml

      - name: Test the native provider crate
        run: cargo test --manifest-path native/dsh-native/Cargo.toml --lib

      - name: Desktop Host tests
        run: bunx vitest run apps/desktop-host --pool=forks
