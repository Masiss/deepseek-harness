name: Desktop Linux release

# Publish the prepared Linux Desktop build as a GitHub Release.
#
# The release is the update feed: the updater reads `manifest.json` and the
# Office installer reads `components.json` from the release's download
# directory, so one release carries the artifacts and the documents that
# describe them. The lane never runs on a pull request or a branch push: a
# release is published from a tag, and the tag names the release.
on:
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag: each target publishes a release named after it'
        type: string
        required: true
      draft:
        description: 'Create the release as a draft instead of publishing it'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PRIMARY_NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
jobs:
  release:
    name: Build and publish the ${{ matrix.target }} release
    # The arm64 payload needs an arm64 host: the payload carries a native
    # Node, the Rust shell, and the pnpm-built packages.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      DSH_DESKTOP_TARGET: ${{ matrix.target }}
      # Each target publishes its own release, because the artifacts differ
      # and the feed is per target too.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}-${{ matrix.target }}
      # The feed is per target: the Office component archive differs per
      # target.
      FEED_TAG: desktop-feed-${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: a moving Bun version makes the lane's environment drift
          # even though the lockfile freezes the dependencies.
          bun-version: 1.4.3

      # The release tarballs are packed through pnpm, the lane that owns
      # Desktop packaging. The action reads the version from the repository's
      # own `packageManager` field, so it must not name one.
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}

      - name: Install the desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            desktop-file-utils \
            rpm

      - name: Install the workspace
        # The release tarballs are packed by pnpm, the lane that owns Desktop
        # packaging, so the payload is installed through the lockfile that
        # packaging reads.
        run: pnpm install --frozen-lockfile

      # The payload carries the pinned primary runtime (Node, pnpm, and the
      # Office skill assets) the Desktop Host supervises. The upstream CI
      # prepares the same runtime for its own Office lane.
      - name: Prepare the primary runtime
        run: >
          pnpm run prepare:primary-runtime
          --target "$DSH_DESKTOP_TARGET"
          --output "apps/desktop/.desktop-build/targets/$DSH_DESKTOP_TARGET/runtime"
          --cache "$RUNNER_TEMP/primary-runtime-downloads"

      # The release tarballs are the payload's only source: the runtime tree
      # installs the package set from them, so a release contains the same
      # bytes a publication would ship. The step also builds the workspace
      # and the native providers.
      - name: Pack the release tarballs
        run: bash apps/desktop-tauri/scripts/pack-linux.sh "$DSH_DESKTOP_TARGET"

      # The package set, the runtime project, and the seeded profile are
      # prepared from the packed release tarballs, so the payload contains the
      # same bytes a release would publish.
      - name: Prepare the Linux runtime tree
        run: pnpm exec tsx apps/desktop-tauri/scripts/prepare-linux-runtime.ts "$DSH_DESKTOP_TARGET"

      # The release is the first build a user can install, so both Host entries
      # must prove they boot the same profile before the artifacts publish.
      - name: Prove both Host entries boot
        run: bash apps/desktop-tauri/scripts/entry-parity-probe.sh "$DSH_DESKTOP_TARGET"

      # The packaged tree is what a user installs, so the release lane drives
      # the journeys and injects the startup/crash/shutdown/offline failures
      # against it instead of trusting the source tree.
      - name: Drive packaged user journeys
        run: bash apps/desktop-tauri/scripts/packaged-journey-probe.sh "$DSH_DESKTOP_TARGET"

      - name: Inject packaged startup, crash, shutdown, and offline faults
        run: bash apps/desktop-tauri/scripts/fault-probe.sh "$DSH_DESKTOP_TARGET"

      - name: Kill the Host mid-download and prove recovery
        run: bash apps/desktop-tauri/scripts/crash-download-probe.sh "$DSH_DESKTOP_TARGET"

      - name: Kill the Host mid-extract and prove recovery
        run: bash apps/desktop-tauri/scripts/crash-extract-probe.sh "$DSH_DESKTOP_TARGET"

      # The artifacts carry the feed URL, and the feed is a release of its
      # own whose documents move with every release. An application that
      # shipped with one version therefore reads the feed of the newest
      # release, not the feed of the release it shipped with.
      - name: Pack the AppImage
        env:
          DSH_APPIMAGE_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}/manifest.json
          DSH_COMPONENT_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}
        run: bash apps/desktop-tauri/scripts/pack-appimage.sh "$DSH_DESKTOP_TARGET"

      - name: Pack the Debian package
        env:
          DSH_APPIMAGE_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}/manifest.json
          DSH_COMPONENT_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}
        run: bash apps/desktop-tauri/scripts/pack-deb.sh "$DSH_DESKTOP_TARGET"

      - name: Pack the RPM package
        env:
          DSH_APPIMAGE_UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}/manifest.json
          DSH_COMPONENT_FEED: https://github.com/${{ github.repository }}/releases/download/${{ env.FEED_TAG }}
        run: bash apps/desktop-tauri/scripts/pack-rpm.sh "$DSH_DESKTOP_TARGET"

      - name: Check the size budget
        run: bash apps/desktop-tauri/scripts/size-gate.sh "$DSH_DESKTOP_TARGET"

      # A gate that never fails is not a gate: the probe proves the size
      # gate rejects an artifact over the budget and accepts one under it.
      - name: Prove the size gate fails over budget
        run: bash apps/desktop-tauri/scripts/size-gate-probe.sh "$DSH_DESKTOP_TARGET"

      # Removing the package must leave the user's own profile and sessions
      # in place, and must leave nothing of its own behind.
      - name: Prove the removal leaves no user data behind
        run: bash apps/desktop-tauri/scripts/uninstall-probe.sh "$DSH_DESKTOP_TARGET"

      - name: Publish the release and the feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # The feed is signed with the channel's key; the client trusts the
          # matching public key, which the Desktop Host pins.
          DSH_RELEASE_SIGNING_KEY: ${{ secrets.DSH_RELEASE_SIGNING_KEY }}
          # A pushed tag publishes the release: the tag is the reviewed act.
          # A dispatch creates a draft, so a rehearsal never goes live.
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}
        run: |
          set -euo pipefail
          # The feed documents are generated from the prepared tree, so the
          # digest and the size in the manifest describe the exact bytes this
          # release uploads.
          draft_flag=()
          if [ "$RELEASE_DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi
          bunx tsx apps/desktop-tauri/scripts/publish-release.ts "$DSH_DESKTOP_TARGET" \
            --tag "$RELEASE_TAG" --feed-tag "$FEED_TAG" "${draft_flag[@]}"
          echo "release: feed https://github.com/$GITHUB_REPOSITORY/releases/download/$FEED_TAG/manifest.json"
