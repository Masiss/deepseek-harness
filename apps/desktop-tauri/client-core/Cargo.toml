[package]
name = "dsh-client-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Protocol core for DeepSeek Harness desktop and terminal clients"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "cookies", "json"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
httptest = "0.16"
