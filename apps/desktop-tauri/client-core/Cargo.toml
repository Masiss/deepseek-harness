[package]
name = "dsh-client-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Protocol core for DeepSeek Harness desktop and terminal clients"

[dependencies]
futures = "0.3"
multer = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
httptest = "0.16"

[[test]]
name = "binary_response"
path = "src/binary_response.rs"
