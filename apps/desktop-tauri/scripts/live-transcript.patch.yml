# Route the headless profile through the replay adapter.
#
# The replay adapter answers the model's calls from a recorded session, so a
# live session can be replayed without a network call. It owns the route
# itself, so the pi-ai adapter that would call the network is switched off.
- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: openai-codex
            models:
              - id: gpt-5.6-terra
                # The same facts the live route declares, so the recorded
                # request context matches the live one.
                contextWindow: 272000
                systemPromptUpdate: in-history

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-5.6-terra

- id: agent-loop
  config:
    agents:
      - id: main
        provider: openai-codex
        model: gpt-5.6-terra
        cwd: !!js process.cwd()
