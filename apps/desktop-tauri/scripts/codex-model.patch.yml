# Route one headless turn through the ChatGPT-backed Codex provider.
#
# The headless bundle disables the credential store ("one-shot jobs use
# launch-time credentials"), so the Codex OAuth grant the store holds stays
# invisible unless the store is mounted here.
- id: credentials
  disabled: false
  config:
    # The store's watcher would keep the process alive after the answer, so
    # the session would never be flushed to disk.
    watch: false

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: session-title-llm
  disabled: true

- id: agent-default-model
  config:
    provider: openai-codex
    model: gpt-5.6-terra

- id: llm-pi-ai
  config:
    providers:
      openai-codex: {}

- id: agent-loop
  config:
    agents:
      - id: main
        provider: openai-codex
        model: gpt-5.6-terra
        cwd: !!js process.cwd()
