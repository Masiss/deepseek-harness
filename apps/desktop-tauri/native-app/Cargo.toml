[package]
name = "dsh-desktop-native-app"
version = "0.1.0"
edition = "2021"
publish = false
description = "Native desktop shell for DeepSeek Harness"
default-run = "dsh-desktop-native-app"

[[bin]]
name = "dsh-desktop-native-app"
path = "src/gpui_main.rs"
doc = false

[[bin]]
name = "dsh-desktop-egui-legacy"
path = "src/main.rs"
doc = false
required-features = ["legacy-egui"]

[features]
# The gpui shell is the shipped application; the retired egui shell is kept
# buildable behind this feature so its renderers and tests stay intact without
# linking eframe/epaint into the gpui binary.
default = []
legacy-egui = ["dep:eframe"]

[dependencies]
# gpui provides the native window lifecycle and GPU rendering without a webview.
gpui = "0.2.2"
# unicode-segmentation moves the text-input caret over user-perceived characters.
unicode-segmentation = "1"
# eframe keeps the retired egui shell buildable until the gpui port reaches parity.
eframe = { version = "0.36", default-features = true, optional = true }
# client-core owns the Host transport and typed session viewer used by this shell.
dsh-client-core = { package = "dsh-client-core", path = "../client-core" }
# fs2 provides the cross-platform process lock used by the single-instance guard.
fs2 = "0.4"
# tray-icon provides the native system-tray menu and icon; GTK integration is unavailable in minimal builds.
tray-icon = { version = "0.25", default-features = false, features = ["ksni"] }
# rfd provides native file-open and file-save dialogs.
rfd = "0.16"
# dirs provides the user home directory for the lock file path.
dirs = "6"
# image decodes and scales the existing product icon for the system tray.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# reqwest blocking performs the optional startup updater metadata request.
reqwest = { version = "0.12", default-features = true, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
# serde_json renders extensible SessionEvent data without inventing UI-only codecs.
serde_json = "1"
# semver rejects downgrade candidates during the metadata check.
semver = "1"
# base64 decodes the Ed25519 feed signature.
base64 = "0.22"
# ring verifies the Ed25519 feed signature before any artifact is trusted.
ring = "0.17"
unicode-width = "0.2"

[dev-dependencies]
# egui_kittest drives the shipped panels through widget identity and AccessKit.
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }
# test-fixtures exposes wire-shaped Remote Event constructors for the UI fixture.
dsh-client-core = { package = "dsh-client-core", path = "../client-core", features = ["test-fixtures"] }

# xattr 0.2.3 (reached through gpui's archive client) reads the BSD ENOATTR
# alias that current libc no longer defines on Linux; the patched copy maps it
# to ENODATA. The patch satisfies the 0.2 requirement and leaves libc current.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
