[package]
name = "dsh-desktop-tauri"
version = "0.0.0"
edition = "2021"
publish = false
description = "Tauri desktop shell for the DeepSeek Harness"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
codegen-units = 1
panic = "abort"
